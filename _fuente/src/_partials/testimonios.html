<!-- ============ TESTIMONIOS ============ -->
<!-- EDITAR: sustituye estos testimonios de ejemplo por opiniones reales de clientes (con su permiso) -->
<section class="section" id="testimonios">
  <div class="container testimonials" data-carousel>
    <div class="flex-between reveal" style="margin-bottom:44px">
      <div class="section-head mb-0">
        <span class="eyebrow">Opiniones</span>
        <h2 class="mb-0">Lo que dicen <em>nuestros clientes</em></h2>
      </div>
      <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
        <div class="t-nav"><button class="round-btn" data-prev aria-label="Anterior">[[i:arrow-left]]</button><button class="round-btn" data-next aria-label="Siguiente">[[i:arrow]]</button></div>
      </div>
    </div>
    <div class="t-track reveal">
      <figure class="t-card"><div class="t-stars">[[i:star]][[i:star]][[i:star]][[i:star]][[i:star]]</div><blockquote class="t-quote">“Teníamos miedo de que fuera complicado y es justo al revés. Las persianas bajan solas en verano y la factura del aire ha bajado muchísimo.”</blockquote><figcaption class="t-person"><span class="avatar">MG</span><span><b>María G.</b><small>Piso en Chamberí · Home Assistant + Airzone</small></span></figcaption></figure>
      <figure class="t-card"><div class="t-stars">[[i:star]][[i:star]][[i:star]][[i:star]][[i:star]]</div><blockquote class="t-quote">“Los interruptores Legrand quedan preciosos y mis padres los usan como siempre. Yo lo controlo todo desde el móvil. Instalación impecable.”</blockquote><figcaption class="t-person"><span class="avatar">JR</span><span><b>Javier R.</b><small>Chalet en Pozuelo · Legrand with Netatmo</small></span></figcaption></figure>
      <figure class="t-card"><div class="t-stars">[[i:star]][[i:star]][[i:star]][[i:star]][[i:star]]</div><blockquote class="t-quote">“Migramos la iluminación de la oficina a DALI con sensores. Menos consumo, mejor luz y por fin un único panel para todo el edificio.”</blockquote><figcaption class="t-person"><span class="avatar">AL</span><span><b>Ana L.</b><small>Facility manager · Oficinas en Madrid</small></span></figcaption></figure>
      <figure class="t-card"><div class="t-stars">[[i:star]][[i:star]][[i:star]][[i:star]][[i:star]]</div><blockquote class="t-quote">“Me explicaron cada opción sin venderme de más. Empezamos con luces y clima y ahora vamos ampliando poco a poco. Muy profesionales.”</blockquote><figcaption class="t-person"><span class="avatar">CP</span><span><b>Carlos P.</b><small>Vivienda en Las Rozas · Shelly + Aqara</small></span></figcaption></figure>
      <figure class="t-card"><div class="t-stars">[[i:star]][[i:star]][[i:star]][[i:star]][[i:star]]</div><blockquote class="t-quote">“En el hotel controlamos clima e iluminación de cada habitación según ocupación. El ahorro se notó desde el primer mes.”</blockquote><figcaption class="t-person"><span class="avatar">LM</span><span><b>Lucía M.</b><small>Dirección · Hotel boutique en Madrid</small></span></figcaption></figure>
    </div>
  </div>
</section>
